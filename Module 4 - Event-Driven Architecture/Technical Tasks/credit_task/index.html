<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Weather Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        #message-box {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 50;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .modal-content {
            background-color: white;
            padding: 2rem;
            border-radius: 0.5rem;
            text-align: center;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center p-4 sm:p-8">

    <div class="max-w-4xl w-full bg-white rounded-xl shadow-lg p-6 sm:p-10 space-y-8">
        <header class="text-center">
            <h1 class="text-3xl sm:text-4xl font-bold text-gray-800">Local Weather Service</h1>
            <p class="mt-2 text-gray-500">Submit and view sensor readings</p>
        </header>

        <!-- Current Latest Reading Section -->
        <div id="latest-weather-container" class="bg-blue-100 border-l-4 border-blue-500 text-blue-700 p-4 rounded-md">
            <p class="font-bold">Latest Temperature Reading</p>
            <p id="latest-temperature" class="text-xl sm:text-2xl font-semibold mt-2">--</p>
            <p id="latest-timestamp" class="text-sm mt-1">Updated: --</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-8">
            <!-- Form for submitting new readings -->
            <div class="bg-gray-50 p-6 rounded-lg shadow-inner">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Submit New Reading</h2>
                <form id="submit-form" class="space-y-4">
                    <div>
                        <label for="temperature" class="block text-sm font-medium text-gray-600">Temperature (°C)</label>
                        <input type="number" id="temperature" name="temperature" required
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="humidity" class="block text-sm font-medium text-gray-600">Humidity (%)</label>
                        <input type="number" id="humidity" name="humidity" required
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="latitude" class="block text-sm font-medium text-gray-600">Latitude</label>
                        <input type="number" id="latitude" name="latitude" step="any" required
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label for="longitude" class="block text-sm font-medium text-gray-600">Longitude</label>
                        <input type="number" id="longitude" name="longitude" step="any" required
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <button type="submit"
                            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 ease-in-out">
                        Submit Reading
                    </button>
                </form>
            </div>

            <!-- Section for external weather search -->
            <div class="bg-gray-50 p-6 rounded-lg shadow-inner">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Weather by Location</h2>
                <form id="location-form" class="space-y-4">
                    <div>
                        <label for="location-input" class="block text-sm font-medium text-gray-600">Enter city name</label>
                        <input type="text" id="location-input" name="location" placeholder="e.g., Melbourne, AU" required
                               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <button type="submit"
                            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition duration-150 ease-in-out">
                        Get Weather
                    </button>
                </form>
                <div id="location-weather-data" class="mt-4 p-4 bg-white rounded-md shadow-sm hidden">
                    <p id="location-name" class="font-bold text-lg text-gray-800"></p>
                    <p id="location-temperature" class="text-gray-600"></p>
                    <p id="location-condition" class="text-gray-600"></p>
                </div>
            </div>
        </div>

        <!-- Section to display all readings -->
        <div>
            <h2 class="text-2xl font-bold text-gray-800 mb-4">All Sensor Readings</h2>
            <div id="readings-container" class="space-y-4">
                <!-- Reading cards will be inserted here by JavaScript -->
                <p id="loading-message" class="text-gray-500 text-center">Loading readings...</p>
            </div>
        </div>
    </div>

    <!-- Message Box for user feedback -->
    <div id="message-box" class="p-4 rounded-lg text-white shadow-lg transition-transform duration-300 transform translate-x-full hidden"></div>

    <!-- Confirmation Modal -->
    <div id="confirm-modal" class="modal hidden">
        <div class="modal-content">
            <h3 class="text-lg font-bold mb-4">Confirm Deletion</h3>
            <p id="modal-text" class="mb-6">Are you sure you want to delete this reading?</p>
            <div class="flex justify-around">
                <button id="modal-cancel" class="py-2 px-4 rounded-md text-gray-700 bg-gray-200 hover:bg-gray-300">Cancel</button>
                <button id="modal-confirm" class="py-2 px-4 rounded-md text-white bg-red-600 hover:bg-red-700">Delete</button>
            </div>
        </div>
    </div>

    <script>
        // API Base URL
        const API_BASE_URL = 'http://localhost:3000/api/weather';

        // Get DOM elements
        const latestTemperatureEl = document.getElementById('latest-temperature');
        const latestTimestampEl = document.getElementById('latest-timestamp');
        const submitForm = document.getElementById('submit-form');
        const locationForm = document.getElementById('location-form');
        const readingsContainer = document.getElementById('readings-container');
        const loadingMessageEl = document.getElementById('loading-message');
        const messageBox = document.getElementById('message-box');
        const confirmModal = document.getElementById('confirm-modal');
        const modalConfirmBtn = document.getElementById('modal-confirm');
        const modalCancelBtn = document.getElementById('modal-cancel');

        // Show a message to the user
        function showMessage(message, type = 'success') {
            messageBox.textContent = message;
            messageBox.classList.remove('hidden', 'bg-green-500', 'bg-red-500', 'translate-x-full');

            if (type === 'success') {
                messageBox.classList.add('bg-green-500');
            } else {
                messageBox.classList.add('bg-red-500');
            }

            setTimeout(() => {
                messageBox.classList.add('translate-x-full');
            }, 3000);
        }

        // Fetch the latest temperature reading
        async function fetchLatestTemperature() {
            try {
                const response = await fetch(`${API_BASE_URL}/latest`);
                if (!response.ok) {
                    throw new Error('Latest reading not found');
                }
                const data = await response.json();
                latestTemperatureEl.textContent = `${data.temperature}°C`;
                latestTimestampEl.textContent = `Updated: ${new Date(data.timestamp).toLocaleString()}`;
            } catch (error) {
                console.error('Error fetching latest temperature:', error);
                latestTemperatureEl.textContent = 'N/A';
                latestTimestampEl.textContent = 'Updated: N/A';
            }
        }

        // Fetch all sensor readings and display them
        async function fetchAllReadings() {
            loadingMessageEl.classList.remove('hidden');
            readingsContainer.innerHTML = '';
            try {
                const response = await fetch(API_BASE_URL);
                const readings = await response.json();
                
                if (readings.length === 0) {
                    readingsContainer.innerHTML = '<p class="text-gray-500 text-center">No readings found. Submit one above!</p>';
                } else {
                    readings.forEach(reading => {
                        const readingCard = document.createElement('div');
                        readingCard.classList.add('p-4', 'bg-gray-100', 'rounded-md', 'shadow-sm', 'flex', 'flex-col', 'sm:flex-row', 'justify-between', 'items-start', 'sm:items-center', 'space-y-2', 'sm:space-y-0');
                        readingCard.innerHTML = `
                            <div>
                                <p class="text-lg font-medium text-gray-800">${reading.temperature}°C, ${reading.humidity}%</p>
                                <p class="text-sm text-gray-500">
                                    <span class="font-mono">${reading._id}</span>
                                </p>
                                <p class="text-xs text-gray-400 mt-1">${new Date(reading.timestamp).toLocaleString()}</p>
                            </div>
                            <div class="flex space-x-2">
                                <button onclick="handleEdit('${reading._id}')" class="px-3 py-1 text-sm font-medium text-blue-600 bg-blue-100 rounded-md hover:bg-blue-200">Edit</button>
                                <button onclick="handleDelete('${reading._id}')" class="px-3 py-1 text-sm font-medium text-red-600 bg-red-100 rounded-md hover:bg-red-200">Delete</button>
                            </div>
                        `;
                        readingsContainer.appendChild(readingCard);
                    });
                }
            } catch (error) {
                console.error('Error fetching all readings:', error);
                readingsContainer.innerHTML = '<p class="text-red-500 text-center">Failed to load readings. Please check the server.</p>';
            } finally {
                loadingMessageEl.classList.add('hidden');
            }
        }

        // Handle form submission for new readings
        submitForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(submitForm);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch(`${API_BASE_URL}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (response.ok) {
                    showMessage('Sensor reading submitted successfully!');
                    submitForm.reset();
                    fetchLatestTemperature();
                    fetchAllReadings();
                } else {
                    showMessage(result.message || 'Submission failed.', 'error');
                }
            } catch (error) {
                console.error('Submission failed:', error);
                showMessage('An unexpected error occurred during submission.', 'error');
            }
        });

        // Handle location search form submission
        locationForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const location = document.getElementById('location-input').value;
            const locationWeatherEl = document.getElementById('location-weather-data');
            const locationNameEl = document.getElementById('location-name');
            const locationTempEl = document.getElementById('location-temperature');
            const locationConditionEl = document.getElementById('location-condition');
            
            locationWeatherEl.classList.add('hidden');

            try {
                const response = await fetch(`${API_BASE_URL}/location/${encodeURIComponent(location)}`);
                const data = await response.json();
                
                if (response.ok) {
                    locationNameEl.textContent = data.location.name;
                    locationTempEl.textContent = `Temperature: ${data.current.temperature}°C`;
                    locationConditionEl.textContent = `Condition: ${data.current.skytext}`;
                    locationWeatherEl.classList.remove('hidden');
                } else {
                    showMessage(data.message || 'Location not found.', 'error');
                }
            } catch (error) {
                console.error('Weather data fetch failed:', error);
                showMessage('An unexpected error occurred while fetching weather.', 'error');
            }
        });

        // Function to handle reading updates
        async function handleEdit(id) {
            const newTemperature = prompt("Enter new temperature:");
            if (newTemperature === null || newTemperature.trim() === "") {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ temperature: newTemperature })
                });
                const result = await response.json();
                if (response.ok) {
                    showMessage('Reading updated successfully!');
                    fetchLatestTemperature();
                    fetchAllReadings();
                } else {
                    showMessage(result.message || 'Update failed.', 'error');
                }
            } catch (error) {
                console.error('Update failed:', error);
                showMessage('An unexpected error occurred during update.', 'error');
            }
        }

        // Function to handle reading deletion
        let readingToDeleteId = null;

        function handleDelete(id) {
            readingToDeleteId = id;
            confirmModal.classList.remove('hidden');
        }
        
        modalCancelBtn.addEventListener('click', () => {
            confirmModal.classList.add('hidden');
            readingToDeleteId = null;
        });

        modalConfirmBtn.addEventListener('click', async () => {
            if (!readingToDeleteId) return;

            confirmModal.classList.add('hidden');
            
            try {
                const response = await fetch(`${API_BASE_URL}/${readingToDeleteId}`, {
                    method: 'DELETE'
                });
                const result = await response.json();
                if (response.ok) {
                    showMessage('Reading deleted successfully!');
                    fetchLatestTemperature();
                    fetchAllReadings();
                } else {
                    showMessage(result.message || 'Delete failed.', 'error');
                }
            } catch (error) {
                console.error('Delete failed:', error);
                showMessage('An unexpected error occurred during delete.', 'error');
            } finally {
                readingToDeleteId = null;
            }
        });

        // Initial fetch on page load
        window.onload = () => {
            fetchLatestTemperature();
            fetchAllReadings();
        };

    </script>
</body>
</html>
