# MongoDB Secret Template
# Create actual secret with:
# kubectl create secret generic mongodb-secret --from-literal=connectionString='your-mongodb-uri'

apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
type: Opaque
data:
  # Base64 encoded connection string
  # Replace with: echo -n 'mongodb+srv://...' | base64
  connectionString: <BASE64_ENCODED_MONGODB_URI>

