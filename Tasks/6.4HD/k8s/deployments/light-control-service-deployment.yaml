apiVersion: apps/v1
kind: Deployment
metadata:
  name: light-control-service
  labels:
    app: light-control-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: light-control-service
  template:
    metadata:
      labels:
        app: light-control-service
        tier: backend
    spec:
      containers:
      - name: light-control-service
        image: iot-light-control-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3002
          name: http
        env:
        - name: PORT
          value: "3002"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: mongodb-secret
              key: connectionString
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "800m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3002
          initialDelaySeconds: 10
          periodSeconds: 5

