apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: automation-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: automation-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 35
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 60

