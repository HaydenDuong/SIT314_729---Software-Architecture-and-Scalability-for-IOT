apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: light-control-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: light-control-service
  minReplicas: 1
  maxReplicas: 8
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 15
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 60

